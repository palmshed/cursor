name: Pages
on:
  push:
    branches: [main]
    paths: ['.github/index.html', '.github/github-app.html']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github
      - id: deployment
        uses: actions/deploy-pages@v4

  brand-cursor:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment:
      name: bot
      url: https://github.com/bniladridas/cursor/blob/main/.github/github-app.html
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deployment complete for bot environment."
