name: CI Status
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            'https://api.github.com/repos/bniladridas/cursor/actions/runs?per_page=10' \
            > .github/ci-status.json
          echo "--- api response ---"
          head -c 200 .github/ci-status.json
          echo ""
          echo "--- end ---"
          git config user.name 'palmshed-cursor[bot]'
          git config user.email '294867837+palmshed-cursor[bot]@users.noreply.github.com'
          git add .github/ci-status.json
          git diff --quiet && echo "no changes" || (git commit -m 'update ci-status.json' && git push)
