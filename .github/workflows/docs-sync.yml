name: docs
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://github.com/palmshed/cursor-docs
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: palmshed/cursor-docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: dest
      - run: |
          cp -r source/docs dest/docs.tmp
          cp dest/docs/_config.yml dest/docs.tmp/ 2>/dev/null || true
          cp -r dest/docs/_layouts dest/docs.tmp/ 2>/dev/null || true
          cp -r dest/docs/assets dest/docs.tmp/ 2>/dev/null || true
          rm -rf dest/docs
          mv dest/docs.tmp dest/docs
          rm -f dest/docs/sync.md
      - run: |
          cd dest
          git config user.name "palmshed-cursor[bot]"
          git config user.email "294867837+palmshed-cursor[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && echo "no changes" || git commit -m "sync docs from cursor@$GITHUB_SHA"
          git push
