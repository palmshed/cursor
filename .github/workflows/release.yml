name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential libcurl4-openssl-dev libpqxx-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/cursor-agent release/cursor-linux
          cd release && tar -czf cursor_${GITHUB_REF_NAME}_linux_amd64.tar.gz cursor-linux

      - uses: actions/upload-artifact@v6
        with:
          name: cursor-linux
          path: release/*.tar.gz

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install cmake nlohmann-json
          # remove brew curl/cpr so cmake uses system curl and builds cpr from source
          brew uninstall --ignore-dependencies curl cpr 2>/dev/null || true

      - name: Configure
        run: |
          SDK=$(xcrun --show-sdk-path)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCURL_INCLUDE_DIR="$SDK/usr/include" \
            -DCURL_LIBRARY="$SDK/usr/lib/libcurl.tbd"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/bin/cursor-agent release/cursor-macos
          cd release && tar -czf cursor_${GITHUB_REF_NAME}_darwin_arm64.tar.gz cursor-macos
          # build bottle
          mkdir -p bottle/cursor/${version}/bin
          cp ../build/bin/cursor-agent bottle/cursor/${version}/bin/cursor-agent
          tar -C bottle -czf cursor-${version}.arm64_sequoia.bottle.tar.gz cursor

      - uses: actions/upload-artifact@v6
        with:
          name: cursor-macos
          path: |
            release/*.tar.gz
            release/*.bottle.tar.gz

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup
        run: |
          powershell -Command "
            Set-ExecutionPolicy Bypass -Scope Process -Force;
            iwr https://chocolatey.org/install.ps1 -UseBasicParsing | iex;
            choco install -y cmake --no-progress;
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg;
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics;
            C:\vcpkg\vcpkg.exe integrate install;
            C:\vcpkg\vcpkg.exe install cpr nlohmann-json --triplet x64-windows
          "

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/Release/cursor-agent.exe release/cursor-windows.exe
          cd release && 7z a -tzip cursor_${GITHUB_REF_NAME}_windows_amd64.zip cursor-windows.exe

      - uses: actions/upload-artifact@v6
        with:
          name: cursor-windows
          path: release/*.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CURSOR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CURSOR_BOT_PRIVATE_KEY }}

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: release/

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Compute checksums
        run: |
          find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec shasum -a 256 {} + > release/checksums.txt || find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + > release/checksums.txt

      - name: Compute source SHA
        run: |
          curl -sL "https://github.com/bniladridas/cursor/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o /tmp/source.tar.gz
          echo "SOURCE_SHA=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Compute bottle SHA
        run: |
          version="${GITHUB_REF_NAME#v}"
          bottle=$(find release -name "*.bottle.tar.gz" | head -1)
          if [ -n "$bottle" ]; then
            echo "BOTTLE_SHA=$(sha256sum "$bottle" | cut -d' ' -f1)" >> $GITHUB_ENV
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            $(find release -name '*.tar.gz' -o -name '*.zip' | sed 's|^|  |') \
            release/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone https://github.com/palmshed/homebrew-cursor /tmp/homebrew-cursor
          cd /tmp/homebrew-cursor
          sed -i "s|url \".*\"|url \"https://github.com/bniladridas/cursor/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz\"|" Formula/cursor.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SOURCE_SHA}\"|" Formula/cursor.rb
          sed -i "s|root_url \".*\"|root_url \"https://github.com/bniladridas/cursor/releases/download/${GITHUB_REF_NAME}\"|" Formula/cursor.rb
          if [ -n "${BOTTLE_SHA}" ]; then
            sed -i "s|sha256 arm64_sequoia: \".*\"|sha256 arm64_sequoia: \"${BOTTLE_SHA}\"|" Formula/cursor.rb
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cursor.rb
          git commit -m "chore: update formula for ${GITHUB_REF_NAME}"
          git push origin main

      - name: Update package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Publish npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public --provenance 2>&1 || echo "already published"
