name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: cursor-linux
            ext: ''
          - os: macos-latest
            artifact_name: cursor-macos
            ext: ''
          - os: windows-latest
            artifact_name: cursor-windows
            ext: .exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y nlohmann-json3-dev cmake build-essential libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake nlohmann-json curl

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake --yes
          choco install nlohmann-json --yes
          choco install curl --yes

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp build/bin/cursor-agent${{ matrix.ext }} release/${{ matrix.artifact_name }}${{ matrix.ext }}
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a -tzip release-${{ matrix.artifact_name }}.zip release/*
          else
            tar -czvf release-${{ matrix.artifact_name }}.tar.gz release/*
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          file: release-${{ matrix.artifact_name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Compute SHA256
        run: |
          curl -sL "https://github.com/bniladridas/cursor/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o /tmp/source.tar.gz
          echo "SHA256=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Update Homebrew formula
        run: |
          sed -i "s|url \".*\"|url \"https://github.com/bniladridas/cursor/archive/refs/tags/${{ github.ref_name }}.tar.gz\"|" Formula/cursor.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ env.SHA256 }}\"|" Formula/cursor.rb

      - name: Create Formula PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/${{ github.ref_name }}
          title: "chore: update formula for ${{ github.ref_name }}"
          body: Auto-generated by release workflow.
          add-paths: Formula/cursor.rb

      - name: Publish npm
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        continue-on-error: true
